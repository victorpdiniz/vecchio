services:
  backend:
    build: ./backend
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"
    env_file:
      - ./backend/.env
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      # backend/uploads/ já fica persistido pelo bind mount acima.
      #
      # Utilitário de pendrive (fase 8): monta as pastas do HOST (não do
      # container) nos caminhos internos que USB_BASE_DIR/USB_DRIVES_DIR
      # apontam. Sem USB_HOST_*_DIR definidos (num .env na raiz do
      # projeto), cai no sandbox local abaixo — dá pra testar o fluxo
      # completo sem tocar no filesystem real da máquina. Em produção,
      # aponte para as pastas de verdade, ex:
      #   USB_HOST_DOCUMENTS_DIR=/home/usuario/Documentos
      #   USB_HOST_DRIVES_DIR=/media/usuario
      - ${USB_HOST_DOCUMENTS_DIR:-./backend/usb-sandbox/documentos}:/usb-documentos
      - ${USB_HOST_DRIVES_DIR:-./backend/usb-sandbox/drives}:/usb-drives

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
