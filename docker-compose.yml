# Nome fixo do projeto — o watcher de autoatualização (scripts/vecchio-
# update-watcher.sh) usa `docker compose restart backend frontend`, que
# depende do nome do projeto para achar os containers certos; sem isso o
# Compose usa o nome da pasta, que pode variar entre checkouts.
name: vecchio

services:
  backend:
    build: ./backend
    # prisma generate roda a cada boot (não só na imagem) porque node_modules
    # fica num volume nomeado separado do bind mount do código — depois de um
    # `git pull` que mude o schema, só reiniciar não bastaria sem isso (ver
    # docs/self-update-setup.md, que documenta o incidente que motivou isto).
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run dev"
    env_file:
      - ./backend/.env
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      # Só o diretório .git (não o restante do repositório) — dá pro módulo
      # de autoatualização rodar `git --git-dir=/repo.git fetch/rev-parse`
      # para checar se há atualização, sem acesso de escrita ao código-fonte
      # nem ao socket do Docker (ver docs/self-update-setup.md).
      - ./.git:/repo.git
      # backend/uploads/ já fica persistido pelo bind mount acima.
      #
      # Utilitário de pendrive (fase 8): monta as pastas do HOST (não do
      # container) nos caminhos internos que USB_BASE_DIR/USB_DRIVES_DIR
      # apontam. Sem USB_HOST_*_DIR definidos (num .env na raiz do
      # projeto), cai no sandbox local abaixo — dá pra testar o fluxo
      # completo sem tocar no filesystem real da máquina. Em produção,
      # aponte para as pastas de verdade, ex:
      #   USB_HOST_DOCUMENTS_DIR=/home/usuario/Documentos
      #   USB_HOST_DRIVES_DIR=/media/usuario
      - ${USB_HOST_DOCUMENTS_DIR:-./backend/usb-sandbox/documentos}:/usb-documentos
      - ${USB_HOST_DRIVES_DIR:-./backend/usb-sandbox/drives}:/usb-drives
    restart: unless-stopped


  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:
