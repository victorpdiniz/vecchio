services:
  backend:
    build: ./backend
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"
    env_file:
      - ./backend/.env
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    # backend/uploads/ já fica persistido pelo bind mount acima.
    # Quando o módulo de pendrive (fase 8 do plano) for implementado, o
    # diretório base configurado em USB_BASE_DIR precisa ser montado aqui
    # também, ex: - ${HOME}/Documentos:/host-docs:ro

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
